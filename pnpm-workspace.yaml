packages:
  - '*'
  - 'packages/*'
allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  node-pty: false
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@lobehub/docs-kit@5.27.4 || 5.27.7-beta.1 || 5.27.7-beta.2 || 6.0.0'
  - '@lobehub/ui@5.49.0 || 6.0.0-beta.10 || 6.0.0'
  - '@lobehub/commitlint-config@2.1.6'
  - '@lobehub/eslint-config@2.1.6'
  - '@lobehub/lint@2.1.6'
  - '@lobehub/prettier-config@2.1.6'
  - '@lobehub/remarklint-config@2.1.6'
  - '@lobehub/semantic-release-config@2.1.6'
  - '@lobehub/stylelint-config@2.1.6'
publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
